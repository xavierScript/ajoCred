<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AjoCred turns verified diaspora remittance history into collateral-free credit for recipients in Nigeria."
    />
    <meta name="theme-color" content="#faf8f4" />
    <title>AjoCred — Your remittance history is your credit history</title>
    <script>
      // Apply the saved/system theme before paint to avoid a flash of the wrong mode.
      (function () {
        try {
          var t = localStorage.getItem("ajocred-theme");
          if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
